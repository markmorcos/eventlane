version: 0.6.0

namespace: eventlane
project: backend

services:
  - name: api
    image: ghcr.io/markmorcos/eventlane-backend-api
    context: backend
    port: 8080
    env:
      - name: JAVA_TOOL_OPTIONS
        value: "-XX:MaxRAMPercentage=75 -XX:InitialRAMPercentage=50 -XX:+UseG1GC -XX:+ExitOnOutOfMemoryError"
      - name: MONGODB_URI
        valueFrom:
          secretKeyRef:
            name: mongodb-credentials
            key: MONGODB_URI
      - name: FIREBASE_PROJECT_ID
        value: eventlane-cd9d2
      - name: FIREBASE_CREDENTIALS_PATH
        value: /secrets/firebase-service-account.json
      - name: MINIO_ENDPOINT
        value: https://cdn.morcos.tech
      - name: MINIO_ACCESS_KEY
        valueFrom:
          secretKeyRef:
            name: minio-credentials
            key: MINIO_ACCESS_KEY
      - name: MINIO_SECRET_KEY
        valueFrom:
          secretKeyRef:
            name: minio-credentials
            key: MINIO_SECRET_KEY
      - name: MINIO_BUCKET_NAME
        value: eventlane
      - name: RESEND_API_KEY
        valueFrom:
          secretKeyRef:
            name: resend-credentials
            key: RESEND_API_KEY
      - name: RESEND_FROM_EMAIL
        value: noreply@eventlane.io
      - name: EMAIL_FROM_NAME
        value: EventLane
      - name: EMAIL_ENABLED
        value: "true"
    volumes:
      - name: firebase-credentials
        secret:
          secretName: firebase-credentials
        mountPath: /secrets
    resources:
      requests:
        cpu: 250m
        memory: 512Mi
      limits:
        cpu: 1500m
        memory: 1Gi
    startupProbe:
      httpGet:
        path: /actuator/health/liveness
        port: 8080
      initialDelaySeconds: 10
      periodSeconds: 5
      failureThreshold: 24
    livenessProbe:
      httpGet:
        path: /actuator/health/liveness
        port: 8080
      periodSeconds: 10
      timeoutSeconds: 3
      failureThreshold: 3
    readinessProbe:
      httpGet:
        path: /actuator/health/readiness
        port: 8080
      periodSeconds: 5
      timeoutSeconds: 2
      failureThreshold: 3
    terminationGracePeriodSeconds: 30
    ingress:
      host: api.eventlane.io
      path: /?(.*)
      pathType: ImplementationSpecific
